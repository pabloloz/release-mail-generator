<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFC Técnico — Lista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-darker: #1e3a8a;
            --primary-light: #eff6ff; --success: #059669; --danger: #dc2626; --warning: #d97706;
            --border: #e2e8f0; --bg: #f1f5f9; --bg-section: #f8fafc;
            --text: #0f172a; --text-muted: #64748b;
            --shadow-md: 0 4px 24px rgba(0,0,0,.09); --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
            --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; margin: 0; }

        .page-header { background: white; border-bottom: 1px solid var(--border); padding: 20px 32px; }
        .page-header h1 { font-size: 1.15rem; font-weight: 700; margin: 0; }
        .page-header p { font-size: .82rem; color: var(--text-muted); margin: 4px 0 0; }
        .page-body { max-width: 1080px; margin: 0 auto; padding: 24px; }

        .search-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; border: 1.5px solid var(--border); border-radius: 20px; padding: 9px 18px; font-size: .84rem; font-family: inherit; outline: none; transition: border-color .15s; }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .btn-new { background: var(--primary); color: white; border: none; padding: 9px 20px; border-radius: var(--radius-xs); font-weight: 600; font-size: .84rem; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: background .15s; }
        .btn-new:hover { background: var(--primary-dark); color: white; }

        .rfc-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px; transition: box-shadow .15s, border-color .15s; cursor: pointer; text-decoration: none; color: inherit; }
        .rfc-card:hover { box-shadow: var(--shadow-md); border-color: #93c5fd; }
        .rfc-card .rfc-number { font-weight: 700; color: var(--primary); font-size: .88rem; min-width: 100px; }
        .rfc-card .rfc-name { flex: 1; font-size: .86rem; font-weight: 500; }
        .rfc-card .rfc-meta { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .rfc-card .rfc-meta span { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }
        .status-badge { font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
        .status-borrador { background: #f1f5f9; color: #475569; }
        .status-validacion { background: #fef3c7; color: #92400e; }
        .status-aprobado { background: #d1fae5; color: #065f46; }
        .status-rechazado { background: #fee2e2; color: #991b1b; }
        .result-cumple { background: #d1fae5; color: #065f46; }
        .result-nocumple { background: #fee2e2; color: #991b1b; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .4; }

        @media (max-width: 640px) {
            .rfc-card { flex-direction: column; align-items: flex-start; gap: 8px; }
            .rfc-card .rfc-meta { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div style="max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
            <h1>📋 RFC Técnico Final</h1>
            <p th:text="${#lists.size(rfcList)} + ' registro(s)'"></p>
        </div>
        <a href="/rfc/new" class="btn-new">+ Nuevo RFC</a>
    </div>
</div>

<div class="page-body">
    <!-- Search -->
    <div class="search-bar">
        <input type="text" id="filterInput" placeholder="🔍 Filtrar por RFC, nombre o tester..." oninput="filterList()">
    </div>

    <!-- Cards list -->
    <div id="rfcListContainer">
        <div th:if="${#lists.isEmpty(rfcList)}" class="empty-state">
            <div class="icon">📋</div>
            <h5 style="font-weight:600;margin-bottom:8px;">No hay registros</h5>
            <p style="font-size:.84rem;margin-bottom:16px;">Crea el primer RFC Técnico para comenzar.</p>
            <a href="/rfc/new" class="btn-new">+ Crear primer RFC</a>
        </div>

        <a th:each="rfc : ${rfcList}" th:href="@{/rfc/{id}(id=${rfc.id})}" class="rfc-card" th:data-search="${rfc.rfcNumber + ' ' + rfc.changeName + ' ' + rfc.testerName}">
            <span class="rfc-number" th:text="${rfc.rfcNumber ?: '—'}"></span>
            <span class="rfc-name" th:text="${rfc.changeName ?: '(sin nombre)'}"></span>
            <div class="rfc-meta">
                <span th:text="${rfc.validationDate ?: ''}"></span>
                <span th:text="${rfc.testerName ?: ''}"></span>
                <span class="status-badge"
                      th:classappend="${rfc.status == 'Aprobado' ? 'status-aprobado' : rfc.status == 'Rechazado' ? 'status-rechazado' : rfc.status == 'En validación' ? 'status-validacion' : 'status-borrador'}"
                      th:text="${rfc.status ?: 'Borrador'}"></span>
                <span th:if="${rfc.finalResult != null and !rfc.finalResult.isBlank()}"
                      class="status-badge"
                      th:classappend="${rfc.finalResult == 'Cumple' ? 'result-cumple' : 'result-nocumple'}"
                      th:text="${rfc.finalResult}"></span>
            </div>
        </a>
    </div>
</div>

<script>
function filterList() {
    const q = document.getElementById('filterInput').value.toLowerCase();
    document.querySelectorAll('.rfc-card').forEach(card => {
        const text = (card.dataset.search || '').toLowerCase();
        card.style.display = text.includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
