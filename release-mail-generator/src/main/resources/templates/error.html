<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/js/dark-mode.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --text: #0f172a; --text-muted: #64748b; }
        [data-theme="dark"] { --bg: #0f172a; --text: #e2e8f0; --text-muted: #94a3b8; }
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .error-container { text-align: center; max-width: 440px; padding: 40px 24px; }
        .error-code { font-size: 5rem; font-weight: 800; color: var(--primary); opacity: .15; line-height: 1; margin-bottom: 8px; }
        .error-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .error-desc { font-size: .88rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        .error-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: white; text-decoration: none; padding: 10px 24px; border-radius: 8px; font-size: .88rem; font-weight: 600; transition: background .15s; }
        .error-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" th:text="${status ?: '404'}">404</div>
        <div class="error-title" th:text="${error ?: 'Página no encontrada'}">Página no encontrada</div>
        <div class="error-desc">La página que buscas no existe o ha sido movida. Verifica la URL o regresa al inicio.</div>
        <a href="/" class="error-btn">← Volver al inicio</a>
    </div>
</body>
</html>
