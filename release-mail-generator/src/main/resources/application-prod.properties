# ── Perfil: PRODUCCIÓN ────────────────────────────────────────────────────────
# Activa con: java -Dspring.profiles.active=prod -jar app.jar
# En Render: Environment variable  SPRING_PROFILES_ACTIVE=prod

spring.thymeleaf.cache=true
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# ── Base de datos: PostgreSQL configurable por variables de entorno ─────────
# Obligatorias (sin valores por defecto): si faltan, la app no arranca.
#   DB_URL      jdbc:postgresql://host:5432/nombre_bd
#   DB_USERNAME usuario de la base de datos
#   DB_PASSWORD contraseña de la base de datos
# Ver README.md → "Persistencia en producción (PostgreSQL)" para el detalle completo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway crea/actualiza el esquema; Hibernate solo valida que coincide con las
# entidades (nunca genera ni altera DDL en producción).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# ── Memoria: instancia de Render con RAM limitada ────────────────────────────
# El proyecto no usa relaciones JPA lazy, así que open-in-view no aporta nada
# y solo mantiene conexiones/recursos abiertos más tiempo del necesario.
spring.jpa.open-in-view=false

# Menos hilos de Tomcat = menor huella de memoria (stacks + estructuras internas).
# Esta es una herramienta interna con tráfico bajo; 200 hilos por defecto es excesivo.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=20
server.tomcat.max-connections=100
