# ── Perfil: PRODUCCIÓN ────────────────────────────────────────────────────────
# Activa con: java -Dspring.profiles.active=prod -jar app.jar
# En Render: Environment variable  SPRING_PROFILES_ACTIVE=prod

spring.thymeleaf.cache=true
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# En Render, para persistencia real usar disco montado en /data
# spring.datasource.url=jdbc:h2:file:/data/rfcdb;DB_CLOSE_ON_EXIT=FALSE

# ── Memoria: instancia de Render con RAM limitada ────────────────────────────
# El proyecto no usa relaciones JPA lazy, así que open-in-view no aporta nada
# y solo mantiene conexiones/recursos abiertos más tiempo del necesario.
spring.jpa.open-in-view=false

# Menos hilos de Tomcat = menor huella de memoria (stacks + estructuras internas).
# Esta es una herramienta interna con tráfico bajo; 200 hilos por defecto es excesivo.
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=20
server.tomcat.max-connections=100
