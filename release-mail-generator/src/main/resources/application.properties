spring.application.name=release-mail-generator
server.port=${PORT:8080}

# ── H2 Database (persistencia en fichero) ────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/rfcdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console deshabilitada por defecto (habilitada solo en perfil dev)
spring.h2.console.enabled=false
