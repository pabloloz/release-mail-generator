spring.application.name=release-mail-generator
server.port=${PORT:8080}

# ── H2 Database (persistencia en fichero) ────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/rfcdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Límites de payload (seguridad: evitar DoS) ──────────────────────────────
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.connection-timeout=60000
server.tomcat.max-http-response-header-size=16KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.codec.max-in-memory-size=50MB

# H2 Console deshabilitada por defecto (habilitada solo en perfil dev)
spring.h2.console.enabled=false

# Disable caching for templates and static resources during development
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Allow large Thymeleaf responses (RFC with base64 evidence images)
server.tomcat.max-save-post-size=-1
